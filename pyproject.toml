[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hazewatch"
version = "1.0.0"
description = "Air-quality data platform for Southeast Asian cities: API -> data lake -> warehouse -> dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hazewatch = "hazewatch.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
